<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RADIOHEAD ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <h1 class="loading-title">THE RADIOHEAD ARCHIVE</h1>
            <div class="loading-status" id="loading-status">INITIALIZING ARCHIVE...</div>
            <div class="loading-bar-container">
                <div class="loading-bar-fill" id="loading-bar-fill"></div>
                <div class="loading-bar-glow"></div>
            </div>
            <div class="loading-percentage" id="loading-percentage">0%</div>
            <div class="loading-text" id="loading-text">LOADING WEBGL CONTEXT</div>
        </div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div class="ui-layer">
        <header>
            <h1>RADIOHEAD</h1>
            <div class="system-status">SYSTEM: ONLINE</div>
        </header>
        
        <div class="center-content">
            <div class="album-poster-container">
                <img id="album-poster" class="album-poster" src="" alt="Album Cover">
                <div class="poster-loading" id="poster-loading">LOADING...</div>
            </div>
            <h2 id="era-title">IN RAINBOWS</h2>
            <div id="era-year" class="era-year"></div>
            <div id="era-description" class="era-description"></div>
            <div id="era-tracks" class="era-tracks"></div>
        </div>
        
        <div class="terminal-log"></div>
        
        <div class="scroll-indicator">
            <div class="scroll-progress-bar"></div>
            <div class="scroll-eras">
                <div class="scroll-era active" data-era="0">IN RAINBOWS</div>
                <div class="scroll-era" data-era="1">OK COMPUTER</div>
                <div class="scroll-era" data-era="2">KID A</div>
            </div>
        </div>
        
        <button id="audio-btn" class="audio-button">INITIALIZE_AUDIO</button>
        
        <footer class="legal">
            UNOFFICIAL FAN PROJECT. EDUCATIONAL USE ONLY.
        </footer>
    </div>
    
    <div class="crt-scanline"></div>
    
    <script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script type="module">
        // Wait for scripts to load with proper error handling
        function waitForThree() {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const maxAttempts = 200; // 10 seconds max wait
            
                const check = () => {
                    attempts++;
                    if (typeof THREE !== 'undefined') {
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        reject(new Error('THREE.js failed to load after timeout'));
                    } else {
                        setTimeout(check, 50);
                    }
                };
                check();
            });
        }
        
        async function initApp() {
            try {
                await waitForThree();
                import('./src/main.js').catch(err => {
                    console.error('Failed to load main module:', err);
                    const loadingText = document.getElementById('loading-text');
                    if (loadingText) {
                        loadingText.textContent = 'ERROR: MODULE LOAD FAILED';
                    }
                });
            } catch (error) {
                console.error('THREE.js loading error:', error);
                const loadingText = document.getElementById('loading-text');
                if (loadingText) {
                    loadingText.textContent = 'ERROR: THREE.JS FAILED TO LOAD';
                }
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
